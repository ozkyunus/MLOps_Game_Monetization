# PostgreSQL — the platform's state (features, prediction/decision/copilot logs).
#
# Secrets are NOT in this file (a real password was once committed to this
# repo; never again). Create before first apply:
#   kubectl -n monetization create secret generic postgres-secret \
#     --from-literal=POSTGRES_USER=train \
#     --from-literal=POSTGRES_PASSWORD=<value from .env> \
#     --from-literal=POSTGRES_DB=monetization_db
#
# HONEST NOTE (single-node teaching cluster): one replica + Recreate + PVC.
# Production would use a managed DB (RDS/Cloud SQL) or a Postgres operator
# (CloudNativePG) — this Deployment has no HA, no failover, no PITR backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: monetization
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: monetization
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # two postgres pods must never share one PVC
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "train", "-d", "monetization_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "train", "-d", "monetization_db"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: monetization
spec:
  type: ClusterIP           # DB is cluster-internal only
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
