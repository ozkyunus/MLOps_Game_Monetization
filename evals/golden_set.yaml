# ═══════════════════════════════════════════════════════════════════════════
# COPILOT GOLDEN SET — the LLM's "held-out test set"
# ═══════════════════════════════════════════════════════════════════════════
# Her giriş bir soru + beklenen davranış tanımı. Alanlar:
#   id:               kısa benzersiz slug
#   question:         kullanıcının soracağı soru (TR veya EN)
#   expected_sources: cevabın GETİRMESİ gereken doküman id'leri (dosya adının
#                     baştaki NN-slug kısmı, örn: 01-hybrid-casual-retention-benchmarks)
#                     — boş liste = doküman gerekmiyor
#   expected_tools:   çağırması GEREKEN tool'lar (boş = tool gerekmez)
#   must_contain:     cevapta geçmesi gereken ifadeler/sayılar (case-insensitive)
#   must_not_contain: geçmemesi gerekenler
#   expected_behavior: "answer" (varsayılan) | "refuse" (kapsam dışı — reddetmeli)
#
# Kategoriler dengeli olsun:
#   A) Saf doküman sorusu (RAG)      B) Saf veri sorusu (tool)
#   C) Karma (RAG + tool)            D) Kapsam dışı (refuse)
# ═══════════════════════════════════════════════════════════════════════════

