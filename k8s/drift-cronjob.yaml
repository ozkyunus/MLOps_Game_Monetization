# Drift detection CronJob — the 4th workload type in this cluster
# (Deployment, StatefulSet, Job pattern via ingest, and now CronJob).
#
# Daily at 06:00 UTC: compares the last 7 days of served predictions
# against the training reference and appends to the driftlog table.
# Grafana's drift panel reads that table via the Postgres datasource.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-check
  namespace: monetization
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid           # never two checks at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-pull
          containers:
            - name: drift-check
              image: docker.io/ozkyunus/monetization-api:51c88f3
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.drift.check", "--days", "7"]
              env:
                - name: SQLALCHEMY_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: app-secret
                      key: SQLALCHEMY_DATABASE_URL
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits:   {cpu: 500m, memory: 1Gi}
