name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated runs so a rapid succession of pushes doesn't burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Ruff check
        run: uvx ruff@0.14 check src/ scripts/ dashboard/

  # ── Smoke tests ──────────────────────────────────────────────────────────
  # Only runs when the tests directory has content. Otherwise skipped
  # cleanly — this job is a placeholder that becomes meaningful in P1-7.
  tests:
    name: Pytest smoke tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (including dev group)
        run: uv sync --group dev

      - name: Check if there are tests to run
        id: check_tests
        run: |
          if find tests -type f -name 'test_*.py' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Pytest
        if: steps.check_tests.outputs.has_tests == 'true'
        run: uv run pytest -q

      - name: No tests yet
        if: steps.check_tests.outputs.has_tests == 'false'
        run: echo "tests/ has no test_*.py files yet — skipping pytest."

  # ── Docker build (verifies the Dockerfile still produces a healthy image) ─
  # Skipped on plain pushes to avoid burning ~10min every commit — runs on
  # PRs and on explicit workflow_dispatch.
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push — just prove it compiles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: monetization-api:ci-${{ github.sha }}
          # GHA layer cache so subsequent builds are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
