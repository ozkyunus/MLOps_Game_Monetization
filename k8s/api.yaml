# FastAPI serving — 2 replicas behind a Service.
#
# Secrets (create before first apply):
#   kubectl -n monetization create secret generic app-secret \
#     --from-literal=SQLALCHEMY_DATABASE_URL='postgresql+psycopg2://train:<pw>@postgres:5432/monetization_db' \
#     --from-literal=GOOGLE_API_KEY='<key>'        # optional — LLM features
#
# Probes: /healthz = liveness (process up, dependency-free by design),
# /readyz = readiness (DB reachable + model bundles load) — a pod gets NO
# traffic until models are actually servable. This is where the readyz
# endpoint earns its keep.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: monetization
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: api
          # Phase 3 CI bumps this tag to immutable short-SHAs pushed to
          # Docker Hub; until then the locally built image is used.
          image: docker.io/ozkyunus/monetization-api:ef1905c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SQLALCHEMY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SQLALCHEMY_DATABASE_URL
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: GOOGLE_API_KEY
                  optional: true          # boots without it; /copilot + LLM copy 503
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            # Cap mlflow-client's retry storm: registry lookups are metadata
            # niceties — a down MLflow must never hold model serving hostage.
            - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
              value: "1"
            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "5"
            - name: QDRANT_URL
              value: http://qdrant:6333
          # ML containers start SLOW (DDL + joblib model loads + MLflow
          # lookups happen in the lifespan before the server accepts
          # traffic). Without a startupProbe, the liveness budget
          # (20s + 3×15s) killed pods mid-warm-up → CrashLoopBackOff.
          # startupProbe grants up to 5 minutes; liveness/readiness only
          # begin AFTER it passes.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: monetization
  labels:
    app: api
spec:
  # LoadBalancer: Docker Desktop's cloud-provider-kind binds this to
  # localhost:<port> on the host (kind NodePorts are NOT host-reachable).
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
