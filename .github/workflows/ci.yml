name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual runs — required for the docker-build job's
                       # dispatch path to actually be reachable

# Cancel outdated runs so a rapid succession of pushes doesn't burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────
  # Runs ruff FROM THE LOCKFILE (uv run), not a floating uvx pin — CI and
  # local dev literally execute the same ruff version, no rule drift.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check src/ scripts/ dashboard/ tests/

  # ── Tests ────────────────────────────────────────────────────────────────
  # Unit tests always run; integration tests auto-skip without Postgres +
  # model artifacts (see tests/conftest.py).
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Pytest
        run: uv run pytest -q

  # ── Docker build (verifies the Dockerfile still produces a healthy image) ─
  # Skipped on plain pushes to avoid burning ~10min every commit — runs on
  # PRs and on manual workflow_dispatch.
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push — just prove it compiles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: monetization-api:ci-${{ github.sha }}
          # GHA layer cache so subsequent builds are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
